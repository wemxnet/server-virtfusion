name: Package release

on:
  release:
    types: [published]

jobs:
  package:
    name: Attach Virtfusion.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package files into a Virtfusion folder
        run: |
          mkdir -p build/Virtfusion
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="build" \
            --exclude=".DS_Store" \
            ./ build/Virtfusion/
          (
            cd build
            zip -r Virtfusion.zip Virtfusion
          )
          unzip -l build/Virtfusion.zip

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Virtfusion.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
